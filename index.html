<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Industrial Lounge &mdash; Classic Industrial Music</title>

<meta name="description" content="Underground broadcast of classic industrial music, EBM, darkwave, electronic and new wave. Listen live 24/7 from The Industrial Lounge.">
<meta name="author" content="The Industrial Lounge">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">

<link rel="canonical" href="https://www.theindustriallounge.com/">
<link rel="icon" type="image/png" href="brand_2_final.png">

<!-- Open Graph / Link Preview -->
<meta property="og:title" content="The Industrial Lounge &mdash; Classic Industrial Music">
<meta property="og:description" content="Underground broadcast of classic industrial music, EBM, darkwave, electronic and new wave. Listen live 24/7 from The Industrial Lounge.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.theindustriallounge.com">
<meta property="og:image" content="https://www.theindustriallounge.com/preview.png">
<meta property="og:image:alt" content="The Industrial Lounge — Classic Industrial Music">
<meta property="og:site_name" content="The Industrial Lounge">

<!-- Twitter / X Preview -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Industrial Lounge &mdash; Classic Industrial Music">
<meta name="twitter:description" content="Underground broadcast of classic industrial music, EBM, darkwave, electronic and new wave.">
<meta name="twitter:image" content="https://www.theindustriallounge.com/preview.png">
<meta name="twitter:image:alt" content="The Industrial Lounge — Classic Industrial Music">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #000 url("TIL_BG.png") center center / cover fixed no-repeat;
    color: #d8d8d8;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: stretch;
    text-align: center;
    padding: 48px 32px;
}

.page {
    width: 100%;
    max-width: 1080px;
    min-height: calc(100vh - 96px);
    display: flex;
    flex-direction: column;
}

.live-button:focus-visible,
.mix-link a:focus-visible {
    outline: 2px solid #ff4444;
    outline-offset: 4px;
}

.site-content {
    margin: auto 0;
    display: grid;
    grid-template-columns: minmax(0, 1.45fr) minmax(260px, 0.75fr);
    align-items: center;
    gap: 72px;
}

.primary-column {
    text-align: left;
}

/* Logo / Preview Image */
.logo-wrap {
    width: 100%;
    margin: 0 0 40px 0;
}

.logo-wrap img {
    width: 100%;
    max-width: 512px;
    height: auto;
    display: block;
    margin: 0;
    opacity: 0.88;
}

/* Subtitle */
.subtitle {
    font-size: 14px;
    font-weight: normal;
    letter-spacing: 3px;
    color: #999;
    margin: 0 0 24px 0;
    text-transform: uppercase;
}

.about {
    max-width: 520px;
    margin: 0 0 36px 0;
    color: #777;
    font-size: 13px;
    line-height: 1.8;
}

/* Live Button */
.live-button-wrap {
    margin: 0 0 22px 0;
}

.live-button {
    display: inline-block;
    padding: 14px 30px;
    background: #111;
    border: 1px solid #aa0000;
    color: #ff4444;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 3px;
    font-size: 12px;
    transition: all 0.3s ease;
}

.live-button:hover {
    background: #aa0000;
    color: #ffffff;
    box-shadow: 0 0 12px rgba(255,0,0,0.35);
}

/* Browse Mixes Link */
.mix-link {
    margin-top: 0;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.mix-link a {
    color: #777;
    text-decoration: none;
}

.mix-link a:hover {
    color: #ffffff;
}

/* Station Information */
.station-panel {
    padding: 36px 32px;
    background: #070707;
    border: 1px solid #222;
    text-align: left;
}

.panel-heading {
    margin: 0 0 28px 0;
    color: #666;
    font-size: 10px;
    font-weight: normal;
    letter-spacing: 3px;
    text-transform: uppercase;
}

.broadcast-status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
    color: #d8d8d8;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.status-dot {
    width: 7px;
    height: 7px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #aa0000;
    box-shadow: 0 0 8px rgba(255, 0, 0, 0.3);
}

.genres {
    margin: 0;
    padding: 0;
    list-style: none;
}

.genres li {
    padding: 12px 0;
    color: #888;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.genres li + li {
    border-top: 1px solid #1a1a1a;
}

.location {
    margin: 18px 0 0 0;
    padding-top: 20px;
    border-top: 1px solid #2a2a2a;
    color: #555;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* Footer */
.footer {
    padding-top: 56px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #444;
    text-transform: uppercase;
}

/* Mobile adjustments */
@media (max-width: 760px) {
    body {
        padding: 32px 18px;
    }

    .page {
        max-width: 620px;
        min-height: calc(100vh - 64px);
    }

    .site-content {
        grid-template-columns: 1fr;
        gap: 48px;
    }

    .primary-column {
        text-align: center;
    }

    .logo-wrap {
        margin: 0 auto 32px auto;
    }

    .logo-wrap img {
        margin: 0 auto;
    }

    .mix-link a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 4px;
    }

    .live-button {
        min-height: 44px;
    }

    .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
        margin-bottom: 20px;
    }

    .about {
        margin: 0 auto 30px auto;
        font-size: 12px;
    }

    .live-button-wrap {
        margin-bottom: 20px;
    }

    .station-panel {
        width: 100%;
        max-width: 440px;
        margin: 0 auto;
        padding: 30px 26px;
        text-align: center;
    }

    .broadcast-status {
        justify-content: center;
    }

    .panel-heading {
        margin-bottom: 24px;
    }

    .footer {
        padding-top: 44px;
    }

}
</style>
</head>

<body>

<div class="page">

    <div class="site-content">
        <div class="primary-column">
            <header>
            <!-- Main Logo / Preview Graphic -->
            <div class="logo-wrap">
                <img src="brand_2_clean.png" alt="The Industrial Lounge">
            </div>
            </header>

            <main>
            <!-- Subtitle -->
            <h1 class="subtitle">Classic Industrial Music</h1>

            <p class="about">
                Underground industrial, EBM, darkwave, electronic and new wave broadcast from the edge of the dial.
            </p>

            <!-- Live Button -->
            <div class="live-button-wrap">
                <a href="https://www.mixcloud.com/live/DJAapocalypse/" target="_blank" rel="noopener noreferrer" class="live-button">
                    &#128308; LIVE NOW
                </a>
            </div>

            <!-- Browse Mixes Link -->
            <div class="mix-link">
                <a href="https://www.mixcloud.com/DJAapocalypse/" target="_blank" rel="noopener noreferrer">
                    Browse Mixes
                </a>
            </div>
            </main>
        </div>

        <aside class="station-panel" aria-labelledby="station-info-heading">
            <h2 class="panel-heading" id="station-info-heading">Station Information</h2>

            <div class="broadcast-status">
                <span class="status-dot" aria-hidden="true"></span>
                <span>24/7 Broadcast</span>
            </div>

            <ul class="genres" aria-label="Genres">
                <li>Industrial</li>
                <li>EBM</li>
                <li>Darkwave</li>
                <li>New Wave</li>
            </ul>

            <p class="location">Seattle, Washington</p>
        </aside>
    </div>

    <!-- Footer -->
    <footer class="footer">
        &copy; The Industrial Lounge
    </footer>

</div>

</body>
</html>
